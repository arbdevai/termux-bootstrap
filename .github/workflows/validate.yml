name: Validate bootstrap

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax
        run: |
          bash -n install.sh
          bash -n scripts/setup-chroot.sh
          bash -n scripts/dev-tools.sh
          bash -n scripts/ub
          bash -n scripts/ub-banner
